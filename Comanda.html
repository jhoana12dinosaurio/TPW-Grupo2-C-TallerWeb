<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styleComanda.css" type="text/css"/>
    <title>Registro de Pedidos - Restaurante</title>
    <style>
        body {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 20px;
            padding: 0 20px;
            flex: 2;
        }

    h1 {
        font-size: 40px;
        
    font-family: "Satisfy", cursive;
        margin-bottom: 15px;
        color: #393433;
}

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    select {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      width: 100%;
      max-width: 400px;
    }

    select:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 5px rgba(74, 144, 226, 0.3);
    }

    button {
      background-color: #393433;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }

    button:hover {
      background-color: #357abd;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f5f5f5;
      font-weight: bold;
    }

    .alert {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      display: none;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
      .mesa-container-wrapper {
            flex: 1;
            margin: 20px;
        }

        h1, h2 {
            color: #393433;
            font-family: "Satisfy", cursive;
        }

        .mesa-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }

        .mesa {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        .libre {
            background-color: #d4edda;
            color: #155724;
        }

        .reservado {
            background-color: #fff3cd;
            color: #856404;
        }

        .ocupado {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
  </style>
</head>
<body>
   <div class="container">
        <h1>Gestion de Pedidos</h1>
        <h2>Listado de Pedidos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Mesa</th>
                    <th>Estado</th>
                    <th>Entrada</th>
                    <th>Segundo</th>
                    <th>Postre</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="orderList"></tbody>
        </table>

     <div id="editOrderForm" style="display: none; margin-top: 20px;">
            <h3>Asignar Platos a Mesa</h3>
            <form id="assignPlatesForm">
                <label for="editEntrada">Plato de Entrada:</label>
                <select id="editEntrada" required>
                    <option value="">--Seleccione--</option>
                    <option value="causa">Causa Rellena</option>
                    <option value="sopa">Sopa</option>
                        <option value="tortilla">Tortilla de coliflor</option>
                        <option value="tamal">Tamales de pollo</option>
                        <option value="huancaina">Papa a la huancaina</option>
                        <option value="lechedetigre">
                            Leche de tigre afrodisiaco
                        </option>
        </select>
                 <br>
                <label for="editSegundo">Plato de Segundo:</label>
                <select id="editSegundo" required>
                    <option value="">--Seleccione--</option>
                    <option value="pasta">Pasta al Alfredo</option>
                    <option value="filete">Filete de Res</option>
                        <option value="pollo">Pollo a la parrilla</option>
                        <option value="ceviche">Ceviche clasico</option>
                        <option value="chicharron">
                            Chicharron de pescado y pota
                        </option>
        </select>
       <br>
                <label for="editPostre">Postre:</label>
                <select id="editPostre" required>
                    <option value="">--Seleccione--</option>
                    <option value="parfait">Parfait</option>
                    <option value="helado">Helado</option>
                        <option value="cheesecake">Cheesecake de fresa</option>
                        <option value="ensalada">Ensalada de frutas</option>
        </select>
                <br>

      <button type="submit">Registrar Pedido</button>
      <button type="button" onclick="window.location.href='registropago.html'">Proceder con el pago</button>
    </form>
 </div>
    </div>
    

    <!-- Mapa de las mesas -->
    <div class="mesa-container-wrapper">
        <h2>Mapa de Mesas</h2>
        <div class="mesa-container" id="mesaContainer"></div>
    </div>

    
    
    
    
    
   <script>
        let mesas = [];
        let orders = [];
        let nextOrderId = 1;

        function inicializarMesas() {
            const container = document.getElementById('mesaContainer');
            for (let i = 0; i < 25; i++) {
                const mesa = { id: i + 1, estado: 'libre' };
                mesas.push(mesa);

                const div = document.createElement('div');
                div.className = 'mesa libre';
                div.id = `mesa-${mesa.id}`;
                div.innerText = `Mesa ${mesa.id}`;
                container.appendChild(div);

                div.addEventListener('click', () => registrarMesa(mesa, div));
            }
        }

        function registrarMesa(mesa, elemento) {
            if (mesa.estado === 'libre') {
                mesa.estado = 'reservado';
                const pedido = {
                    id: nextOrderId++,
                    mesaId: mesa.id,
                    estado: mesa.estado,
                    entrada: null,
                    segundo: null,
                    postre: null
                };
                orders.push(pedido);
                actualizarTablaPedidos();
            } else {
                alert('Mesa ya está registrada.');
            }
            elemento.className = `mesa ${mesa.estado}`;
        }

        function editarPedido(mesaId) {
            const pedido = orders.find(order => order.mesaId === mesaId);
            if (!pedido) return;

            const form = document.getElementById('editOrderForm');
            form.style.display = 'block';

            document.getElementById('editEntrada').value = pedido.entrada || '';
            document.getElementById('editSegundo').value = pedido.segundo || '';
            document.getElementById('editPostre').value = pedido.postre || '';

            document.getElementById('assignPlatesForm').onsubmit = (e) => {
                e.preventDefault();
                pedido.entrada = document.getElementById('editEntrada').value;
                pedido.segundo = document.getElementById('editSegundo').value;
                pedido.postre = document.getElementById('editPostre').value;

                actualizarTablaPedidos();
                form.style.display = 'none';
            };
        }

        function actualizarTablaPedidos() {
            const tbody = document.getElementById('orderList');
            tbody.innerHTML = '';
            orders.forEach(order => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${order.id}</td>
                    <td>Mesa ${order.mesaId}</td>
                    <td>${order.estado}</td>
                    <td>${order.entrada || 'N/A'}</td>
                    <td>${order.segundo || 'N/A'}</td>
                    <td>${order.postre || 'N/A'}</td>
                    <td><button onclick="editarPedido(${order.mesaId})">Asignar Platos</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.addEventListener('DOMContentLoaded', inicializarMesas);
    </script>





</body>
</html>
  <script>
    // Variables globales
    let orders = [];
    let nextId = 1;

    // Cargar datos del localStorage al iniciar
    function cargarDatos() {
      const ordersGuardados = localStorage.getItem('orders');
      const lastIdGuardado = localStorage.getItem('lastId');
      
      if (ordersGuardados) {
        orders = JSON.parse(ordersGuardados);
        actualizarTabla();
      }
      
      if (lastIdGuardado) {
        nextId = parseInt(lastIdGuardado);
      }
    }

    // Guardar datos en localStorage
    function guardarDatos() {
      localStorage.setItem('orders', JSON.stringify(orders));
      localStorage.setItem('lastId', nextId.toString());
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Obtener valores del formulario
      const entrada = document.getElementById('entrada').value;
      const segundo = document.getElementById('segundo').value;
      const postre = document.getElementById('postre').value;

      // Validar campos
      if (!entrada || !segundo || !postre) {
        showAlert('error');
        return;
      }

      // Crear nuevo pedido
      const order = {
        id: nextId++,
        entrada: entrada,
        segundo: segundo,
        postre: postre
      };

      // Agregar a la lista
      orders.push(order);
      
      // Guardar en localStorage
      guardarDatos();
      
      // Actualizar tabla
      actualizarTabla();
      
      // Limpiar formulario
      this.reset();
      
      // Mostrar mensaje de éxito
      showAlert('success');
    });

    function actualizarTabla() {
      const tbody = document.getElementById('orderList');
      tbody.innerHTML = '';
      
      orders.forEach(order => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${order.id}</td>
          <td>${order.entrada}</td>
          <td>${order.segundo}</td>
          <td>${order.postre}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function showAlert(type) {
      const alertSuccess = document.getElementById('alertSuccess');
      const alertError = document.getElementById('alertError');
      
      alertSuccess.style.display = 'none';
      alertError.style.display = 'none';
      
      if (type === 'success') {
        alertSuccess.style.display = 'block';
        setTimeout(() => alertSuccess.style.display = 'none', 3000);
      } else {
        alertError.style.display = 'block';
        setTimeout(() => alertError.style.display = 'none', 3000);
      }
    }

    document.getElementById('proceedPayment').addEventListener('click', function() {
    window.location.href = 'registropago.html';
});

    // Cargar datos al iniciar la página
    cargarDatos();
    
  </script>
  </div>
</body>
</html>

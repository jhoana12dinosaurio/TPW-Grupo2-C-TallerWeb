    <style>

    h1 {

    font-family: "Satisfy", cursive;

}

      .mesa-container-wrapper {
            flex: 1;
            margin: 20px;
        }

            color: #393433;
            font-family: "Satisfy", cursive;
        }

        .mesa-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }

        .mesa {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        .libre {
            background-color: #d4edda;
            color: #155724;
        }

        .reservado {
            background-color: #fff3cd;

        }

        .ocupado {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
  </style>
</head>
<body>
   <div class="container">
        <h1>Gestion de Pedidos</h1>
        <h2>Listado de Pedidos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Mesa</th>
                    <th>Estado</th>
                    <th>Entrada</th>
                    <th>Segundo</th>
                    <th>Postre</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="orderList"></tbody>
        </table>

     <div id="editOrderForm" style="display: none; margin-top: 20px;">
            <h3>Asignar Platos a Mesa</h3>
            <form id="assignPlatesForm">
                <label for="editEntrada">Plato de Entrada:</label>
                <select id="editEntrada" required>
                    <option value="">--Seleccione--</option>
                    <option value="causa" data-price="18">Causa Rellena(S/.18)</option>
                    <option value="sopa" data-price="15">Sopa de semola(S/.15)</option>
                        <option value="tortilla" data-price="15">Tortilla de coliflor(S/.15)</option>
                        <option value="tamal" data-price="14">Tamales de pollo(S/.14)</option>
                        <option value="huancaina" data-price="16">Papa a la huancaina</option>

                 </select>
                 <br>
                <label for="editSegundo">Plato de Segundo:</label>
                <select id="editSegundo" required>
                    <option value="">--Seleccione--</option>
                    <option value="pasta" data-price="40">Pasta al Alfredo(S/.40)</option>
                    <option value="Lomo" data-price="48">Lomo Saltado(S/.48)</option>
                        <option value="pollo" data-price="42">Pollo a la parrilla(S/.42)</option>
                        <option value="ceviche" data-price="52">Ceviche clasico(S/.52)</option>
                        <option value="aji" data-price="38">Aji de gallina(S/.38)</option>
                        <option value="Fetuccini" data-price="36">Fetuccini al Pesto(S/.36)</option>
        </select>
       <br>
                <label for="editPostre">Postre:</label>
                <select id="editPostre" required>
                    <option value="">--Seleccione--</option>
                    <option value="parfait" data-price="25">Parfait frutos rojos(S/.25)</option>
                    <option value="helado"data-price="17">Brownie con Helado(S/.17)</option>
                        <option value="cheesecake"data-price="15">Cheesecake de maracuya(S/.15)</option>
                        <option value="ensalada"data-price="18">Ensalada de frutas(S/.18)</option>
                        <option value="arrozconleche" data-price="12">Arroz con leche(S/.12)</option>
        </select>
                <br>
 <button type="submit">Registrar Pedido</button>
            </form>
        </div>
    </div>

    <div class="mesa-container-wrapper">
        <h2>Mapa de Mesas</h2>
        <div class="mesa-container" id="mesaContainer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
    
    
    
    
     <script>
       const API_URL = 'https://jsonplaceholder.typicode.com/posts'; // URL base de la API
let mesas = [];
let orders = [];
let nextOrderId = 1;

// Inicializar las mesas
function inicializarMesas() {
    const container = document.getElementById('mesaContainer');
    for (let i = 0; i < 25; i++) {
        const mesa = { id: i + 1, estado: 'libre' };
        mesas.push(mesa);

        const div = document.createElement('div');
        div.className = 'mesa libre';
        div.id = `mesa-${mesa.id}`;
        div.innerText = `Mesa ${mesa.id}`;
        container.appendChild(div);

        div.addEventListener('click', () => seleccionarMesa(mesa, div));
    }
}

// Seleccionar una mesa
function seleccionarMesa(mesa, elemento) {
    if (mesa.estado === 'libre') {
        mesa.estado = 'reservado';
        elemento.className = `mesa ${mesa.estado}`;
        editarPedido(mesa.id); // Abre el formulario para registrar el pedido
    } else {
        alert('Mesa ya está registrada.');
    }
}

// Editar o crear un pedido
function editarPedido(mesaId) {
    const form = document.getElementById('editOrderForm');
    form.style.display = 'block';

    document.getElementById('assignPlatesForm').onsubmit = async (e) => {
        e.preventDefault();

        const entrada = document.getElementById('editEntrada').value;
        const segundo = document.getElementById('editSegundo').value;
        const postre = document.getElementById('editPostre').value;

        const nuevoPedido = {
            id: nextOrderId++,
            mesaId: mesaId,
            estado: 'reservado',
            entrada: entrada,
            segundo: segundo,
            postre: postre
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoPedido)
            });
            const pedidoCreado = await response.json();
            orders.push(pedidoCreado);
            actualizarTablaPedidos();
            form.style.display = 'none'; // Oculta el formulario
        } catch (error) {
            console.error('Error al registrar el pedido:', error);
        }
    };
}

// Actualizar la tabla de pedidos
function actualizarTablaPedidos() {
    const tbody = document.getElementById('orderList');
    tbody.innerHTML = '';
    orders.forEach(order => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${order.id}</td>
            <td>Mesa ${order.mesaId}</td>
            <td>${order.estado}</td>
            <td>${order.entrada || 'N/A'}</td>
            <td>${order.segundo || 'N/A'}</td>
            <td>${order.postre || 'N/A'}</td>
            <td>
                <button onclick="eliminarPedido(${order.id})">Eliminar</button>
                <br>
                <button onclick="proceedPayment()">Proceder con el Pago</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Eliminar un pedido
function eliminarPedido(orderId) {
    orders = orders.filter(order => order.id !== orderId);
    actualizarTablaPedidos();
}

// Redirigir al registro de pago
function proceedPayment() {
    window.location.href = 'registropago.html';
}


// Inicializar al cargar la página
document.addEventListener('DOMContentLoaded', inicializarMesas);


    </script>




</body>
</html>
  <script>
    // Variables globales
    let orders = [];
    let nextId = 1;

    // Cargar datos del localStorage al iniciar
    function cargarDatos() {
      const ordersGuardados = localStorage.getItem('orders');
      const lastIdGuardado = localStorage.getItem('lastId');
      
      if (ordersGuardados) {
        orders = JSON.parse(ordersGuardados);
        actualizarTabla();
      }
      
      if (lastIdGuardado) {
        nextId = parseInt(lastIdGuardado);
      }
    }

    // Guardar datos en localStorage
    function guardarDatos() {
      localStorage.setItem('orders', JSON.stringify(orders));
      localStorage.setItem('lastId', nextId.toString());
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Obtener valores del formulario
      const entrada = document.getElementById('entrada').value;
      const segundo = document.getElementById('segundo').value;
      const postre = document.getElementById('postre').value;

      // Validar campos
      if (!entrada || !segundo || !postre) {
        showAlert('error');
        return;
      }

      // Crear nuevo pedido
      const order = {
        id: nextId++,
        entrada: entrada,
        segundo: segundo,
        postre: postre
      };

      // Agregar a la lista
      orders.push(order);
      
      // Guardar en localStorage
      guardarDatos();
      
      // Actualizar tabla
      actualizarTabla();
      
      // Limpiar formulario
      this.reset();
      
      // Mostrar mensaje de éxito
      showAlert('success');
    });

    function actualizarTabla() {
      const tbody = document.getElementById('orderList');
      tbody.innerHTML = '';
      
      orders.forEach(order => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${order.id}</td>
          <td>${order.entrada}</td>
          <td>${order.segundo}</td>
          <td>${order.postre}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function showAlert(type) {
      const alertSuccess = document.getElementById('alertSuccess');
      const alertError = document.getElementById('alertError');
      
      alertSuccess.style.display = 'none';
      alertError.style.display = 'none';
      
      if (type === 'success') {
        alertSuccess.style.display = 'block';
        setTimeout(() => alertSuccess.style.display = 'none', 3000);
      } else {
        alertError.style.display = 'block';
        setTimeout(() => alertError.style.display = 'none', 3000);
      }
    }

    document.getElementById('proceedPayment').addEventListener('click', function() {
    window.location.href = 'registropago.html';
});

    // Cargar datos al iniciar la página
    cargarDatos();
    
  </script>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <link href="css/bootstrap.min.css" rel="stylesheet" />
        <link href="css/card.css" rel="stylesheet" />

        <title>Reserva de Mesas</title>
    </head>
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                url(img/66b45af5451555ee3a8780aa_restaurante.jpeg);
        }

        table {
            background-color: #ffffff;
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f5f5f5;
            font-weight: bold;
        }

        .text-right {
            text-align: right;
        }

        .alert {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            display: none;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        #seccion-descuento {
            display: flex;
        }
        .hide {
            display: none;
        }
        .show {
            display: block;
        }
        .mimodal {
            width: 500px;
            height: 300px;
            position: absolute;
            top: 50px;
            left: 50%;
            margin-left: -250px;
            background-color: #ffffff;
            padding: 20px 10px;
            border-radius: 5px;
            z-index: 10;
        }
        .mioverlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #00000080;
            z-index: 9;
        }
    </style>

    <body>
        <div class="reserva-mesa">
            <h3>Reserva tu Mesa</h3>
            <form id="formReserva" class="form-registro" method="post">
                <label for="nombre">Nombre Completo:</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingrese su nombre completo"
                    required
                />

                <label for="telefono">Teléfono:</label>
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ingrese su número de teléfono"
                    required
                />

                <label for="personas">Número de Personas:</label>
                <input
                    type="number"
                    id="num_personas"
                    name="num_personas"
                    min="1"
                    max="10"
                    placeholder="Ingrese el número de personas"
                    required
                />

                <label for="fecha">Fecha de la Reserva:</label>
                <input type="date" id="fecha" name="fecha" required />

                <label for="hora">Hora de la Reserva:</label>
                <input type="time" id="hora" name="hora" required />

                <div class="cards-container" id="seccion-descuento">
                    <button
                        type="button"
                        class="btn-servicio"
                        onclick="mostrarModal()"
                    >
                        Quiero mi descuento
                    </button>
                    <div class="hide caja-descuento">Descuento</div>
                </div>

                <div id="alertSuccess" class="alert alert-success">
                    Reserva guardada exitosamente
                </div>

                <div id="alertError" class="alert alert-error">
                    Por favor complete todos los campos correctamente
                </div>

                <button type="submit">Reservar Mesa</button>
            </form>

            <div class="mimodal hide" id="modal-descuento">
                <h3 style="color: #4e3e3e">
                    ¡Elige una carta para descubrir tu descuento!
                </h3>
                <div class="cards-container">
                    <div class="card" onclick="revealDiscount(this)">?</div>
                    <div class="card" onclick="revealDiscount(this)">?</div>
                    <div class="card" onclick="revealDiscount(this)">?</div>
                </div>
            </div>
            <div class="mioverlay hide"></div>
        </div>

        <script>
            // Variables globales
            let reservas = [];
            let nextId = 1;
            let descuento = 0;

            //Capturar la data del formulario
            let formReserva = document.querySelector("#formReserva");

            formReserva.addEventListener("submit", (e) => {
                e.preventDefault();

                // Obtener valores del formulario
                const nombre = document.getElementById("nombre").value.trim();
                const telefono = document
                    .getElementById("telefono")
                    .value.trim();
                const num_personas = parseInt(
                    document.getElementById("num_personas").value
                );
                const fecha = document.getElementById("fecha").value.trim();
                const hora = document.getElementById("hora").value.trim();

                // Validar campos
                if (
                    !nombre ||
                    !telefono ||
                    isNaN(num_personas) ||
                    !fecha ||
                    !hora
                ) {
                    showAlert("error");
                    return;
                }

                // Crear una nueva reserva
                const reserva = {
                    id: nextId++,
                    nombre: nombre,
                    telefono: telefono,
                    num_personas: num_personas,
                    fecha: fecha,
                    hora: hora,
                    descuento: descuento,
                };
                // Mostrar notificación de éxito si están permitidas
                if (Notification.permission === "granted") {
                    mostrarNotificacion(
                        "¡Reserva Exitosa!",
                        `${nombre}, tu mesa para ${num_personas} personas está reservada para el ${fecha} a las ${hora}`
                    );
                }

                // Agregar a la lista de reservas
                reservas.push(reserva);

                //Limpiar el formulario
                formReserva.reset();
                // Redirigir al formulario de comanda.html
                window.location.href = "Comanda.html";

                //Almacenado de datos localmente en localStorage
                guardarDatos();

                //recargar página
                showAlert("success");
                //cargarDatos();
            });

            // Guardar datos en localStorage
            function guardarDatos() {
                localStorage.setItem("reservas", JSON.stringify(reservas));
                localStorage.setItem("lastId", nextId.toString());
            }

            function showAlert(type) {
                const alertSuccess = document.getElementById("alertSuccess");
                const alertError = document.getElementById("alertError");

                alertSuccess.style.display = "none";
                alertError.style.display = "none";

                if (type === "success") {
                    alertSuccess.style.display = "block";
                    setTimeout(() => {
                        //alertSuccess.style.display = "none";
                        location.reload();
                    }, 2000);
                } else {
                    alertError.style.display = "block";
                    setTimeout(() => (alertError.style.display = "none"), 3000);
                }
            }

            // Cargar datos del localStorage al iniciar
            function cargarDatos() {
                const reservasAlmacenadas = localStorage.getItem("reservas");
                const lastIdGuardado = localStorage.getItem("lastId");

                if (reservasAlmacenadas) {
                    reservas = JSON.parse(reservasAlmacenadas);
                }

                if (lastIdGuardado) {
                    nextId = parseInt(lastIdGuardado);
                }
            }

            const mostrarModal = () => {
                const modal = document.querySelector("#modal-descuento");
                const mioverlay = document.querySelector(".mioverlay");
                modal.classList.remove("hide");
                mioverlay.classList.remove("hide");
            };

            const ocultarModal = () => {
                const modal = document.querySelector("#modal-descuento");
                const mioverlay = document.querySelector(".mioverlay");
                modal.classList.add("hide");
                mioverlay.classList.add("hide");
            };

            const seleccionarDescuento = () => {
                ocultarModal();

                // Simulamos una probabilidad del 30% de ganar un descuento del 10%
                const ganador = Math.random() < 0.3;
                const botonDescuento = document.querySelector(".btn-servicio");
                const cajaDescuento = document.querySelector(".caja-descuento");

                if (descuento != 0) return false;

                botonDescuento.classList.add("hide");
                cajaDescuento.classList.remove("hide");

                if (ganador) {
                    //Si es true, se lleva el 10%
                    descuento = 10;
                    cajaDescuento.innerHTML = `
                    Haz ganado el ${descuento}% de descuento en el total de tu cuenta.
                    `;
                    return false;
                }

                //Si es false, se lleva el 5%
                descuento = 5;
                cajaDescuento.innerHTML = `
                    Haz ganado el ${descuento}% de descuento en el total de tu cuenta.
                    `;
            };

            function revealDiscount(card) {
                const cards = document.querySelectorAll(".card");

                descuento = 5;
                const isWinner = Math.random() < 0.3;

                if (isWinner) descuento = 10;

                card.textContent = descuento + "%";
                card.classList.add("revealed");

                cards.forEach((element) => {
                    if (!element.classList.contains("revealed")) {
                        element.classList.add("hide");
                    }
                });

                setTimeout(() => {
                    const botonDescuento =
                        document.querySelector(".btn-servicio");
                    const cajaDescuento =
                        document.querySelector(".caja-descuento");

                    botonDescuento.classList.add("hide");
                    cajaDescuento.classList.remove("hide");

                    cajaDescuento.innerHTML = `
                    Haz ganado el ${descuento}% de descuento en el total de tu cuenta.
                    `;

                    ocultarModal();
                }, 1000);
            }

            const verificarDescuento = () => {
                // Simulamos una probabilidad del 30% de ganar un descuento del 10%
                const ganador = Math.random() < 0.3;
                const botonDescuento = document.querySelector(".btn-servicio");
                const cajaDescuento = document.querySelector(".caja-descuento");

                if (descuento != 0) return false;

                botonDescuento.classList.add("hide");
                cajaDescuento.classList.remove("hide");

                if (ganador) {
                    //Si es true, se lleva el 10%
                    descuento = 10;
                    cajaDescuento.innerHTML = `
                    Haz ganado el ${descuento}% de descuento en el total de tu cuenta.
                    `;
                    return false;
                }

                //Si es false, se lleva el 5%
                descuento = 5;
                cajaDescuento.innerHTML = `
                    Haz ganado el ${descuento}% de descuento en el total de tu cuenta.
                    `;
            };

            // Cargar datos al iniciar la página
            cargarDatos();
        </script>
    </body>
</html>
